name: Walletie CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check Worker and SDK JavaScript syntax
        run: npm run check
      - name: Run SDK tests
        run: npm test
      - name: Validate package and Wrangler configuration
        run: node -e "const fs=require('node:fs'); JSON.parse(fs.readFileSync('package.json','utf8')); JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'))"
      - name: Check dashboard JavaScript syntax
        run: node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('public/index.html','utf8'); for (const match of html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)) new Function(match[1]);"
